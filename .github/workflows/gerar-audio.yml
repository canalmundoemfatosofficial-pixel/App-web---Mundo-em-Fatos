name: Gerar Audio TTS

on:
  push:
    branches: [main]
    paths: ['public/painel/roteiros.json']

jobs:
  gerar:
    if: "!contains(github.event.head_commit.message, '[bot]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Gerar audio com Gemini TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/gerar_audio.py

      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/painel/audios/ public/painel/roteiros.json
          git diff --staged --quiet || (git commit -m "bot: audio gerado automaticamente [bot]" && git push)
