name: Gerar Roteiro

on:
  push:
    branches: [main]
    paths: ['public/painel/roteiros.json']

jobs:
  gerar:
    if: "!contains(github.event.head_commit.message, '[bot]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Gerar roteiro com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, os, requests

          with open('public/painel/roteiros.json', 'r', encoding='utf-8') as f:
              roteiros = json.load(f)

          api_key = os.environ['GEMINI_API_KEY']
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key={api_key}"
          updated = False

          for r in roteiros:
              if r.get('status') != 'tema':
                  continue

              tema = r.get('tema', r.get('titulo', ''))
              notas = r.get('notas', '')

              prompt = f"""Você é o roteirista do canal Mundo em Fatos. Crie um roteiro de Short para o tema: "{tema}".

REGRAS:
- Formato: PROF solo, 30 a 45 segundos, 9:16 vertical
- O PROF narra com voz dinâmica, didática e com humor leve
- Estrutura: Gancho → Explicação → Curiosidade → Conclusão
- Termine SEMPRE com: "Segue para ficar por dentro do Mundo."
- Escreva apenas as falas, sem títulos de seção
- Máximo 4 turnos curtos
{f'- Observação: {notas}' if notas else ''}

Responda APENAS com o roteiro em formato JSON assim:
{{"roteiro": "fala completa aqui em texto corrido com cada turno separado por dois saltos de linha"}}"""

              payload = {"contents": [{"parts": [{"text": prompt}]}]}
              resp = requests.post(url, json=payload, timeout=30)
              resp.raise_for_status()

              text = resp.json()['candidates'][0]['content']['parts'][0]['text']
              text = text.strip()
              if text.startswith('```'):
                  text = text.split('\n', 1)[1].rsplit('```', 1)[0].strip()

              try:
                  data = json.loads(text)
                  r['roteiro'] = data.get('roteiro', text)
              except:
                  r['roteiro'] = text

              r['status'] = 'roteiro'
              r['atualizado_em'] = __import__('datetime').date.today().isoformat()
              updated = True
              print(f"Roteiro gerado para: {r.get('titulo', tema)}")

          if updated:
              with open('public/painel/roteiros.json', 'w', encoding='utf-8') as f:
                  json.dump(roteiros, f, ensure_ascii=False, indent=2)
              print("roteiros.json atualizado")
          else:
              print("Nenhum roteiro com status 'tema' encontrado")
          PYEOF

      - name: Commit roteiro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/painel/roteiros.json
          git diff --staged --quiet || git commit -m "bot: roteiro gerado automaticamente [bot]" && git push
