<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Painel — Mundo em Fatos</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #242424;
  --border: #2e2e2e;
  --accent: #e63946;
  --accent2: #f4a261;
  --text: #f0f0f0;
  --muted: #888;
  --radius: 12px;
  --green: #57cc99;
  --blue: #3a86ff;
  --purple: #c77dff;
  --orange: #f4a261;
  --teal: #8ecae6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 100px;
}

/* HEADER */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
header h1 { font-size: 16px; font-weight: 700; }
header h1 span { color: var(--accent); }
.btn-icon {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 7px 11px;
  font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; gap: 5px;
}

/* TABS */
.tabs {
  display: flex; gap: 4px;
  padding: 10px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 20px;
  padding: 5px 13px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.tab.active { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }

/* MAIN */
main { padding: 14px; }

/* STATS */
.stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin-bottom: 16px;
}
.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 10px; text-align: center;
}
.stat-num { font-size: 22px; font-weight: 800; }
.stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* CARDS */
.cards { display: flex; flex-direction: column; gap: 10px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.card-top {
  padding: 12px 14px 8px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
}
.card-info { flex: 1; min-width: 0; }
.badges { display: flex; gap: 5px; margin-bottom: 5px; flex-wrap: wrap; }
.badge {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.4px;
  padding: 2px 7px; border-radius: 20px;
}
.badge-short { background: #1a1200; color: #f4a261; }
.badge-longo { background: #0d1b35; color: #3a86ff; }

/* STATUS BADGES */
.badge-s { background: var(--surface2); color: var(--muted); }
.badge-s.tema      { color: #aaa;         background: #1a1a1a; }
.badge-s.roteiro   { color: var(--blue);  background: #0d1b35; }
.badge-s.roteiro_aprovado { color: var(--teal); background: #0a1e28; }
.badge-s.audio_gerado     { color: var(--orange); background: #2a1800; }
.badge-s.audio_aprovado   { color: var(--green);  background: #0a2218; }
.badge-s.cenarios         { color: var(--purple); background: #1a0a2e; }
.badge-s.montagem         { color: #a8dadc; background: #0a2224; }
.badge-s.agendado         { color: var(--purple); background: #1a0a2e; }
.badge-s.publicado        { color: var(--green);  background: #0a2218; }

.card-titulo { font-size: 14px; font-weight: 700; line-height: 1.3; margin-bottom: 3px; }
.card-desc   { font-size: 12px; color: var(--muted); line-height: 1.4; }
.card-date   { font-size: 11px; color: var(--muted); white-space: nowrap; }

.card-body { padding: 0 14px 12px; }

/* PIPELINE STEPS */
.pipeline {
  display: flex; gap: 4px; margin-bottom: 10px; overflow-x: auto;
  scrollbar-width: none; padding-bottom: 2px;
}
.pipeline::-webkit-scrollbar { display: none; }
.pip-step {
  flex-shrink: 0;
  font-size: 10px; padding: 3px 8px;
  border-radius: 20px; border: 1px solid var(--border);
  color: var(--muted);
  white-space: nowrap;
}
.pip-step.done  { border-color: #333; background: #1a1a1a; color: #555; text-decoration: line-through; }
.pip-step.current { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.pip-step.next  { border-color: var(--border); }

/* CLAUDE BUTTON */
.btn-claude {
  width: 100%; background: #1a1a2e; border: 1px solid #3a3a6e;
  color: #a0a0ff; border-radius: 8px;
  padding: 10px 14px; font-size: 13px; font-weight: 600;
  cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px;
}
.btn-claude:active { opacity: 0.75; }
.btn-claude .claude-icon { font-size: 16px; }

/* ACTION BUTTONS */
.card-actions { display: flex; gap: 7px; flex-wrap: wrap; }
.btn-action {
  flex: 1; min-width: 110px;
  background: var(--accent); color: white;
  border: none; border-radius: 8px;
  padding: 9px 12px; font-size: 12px; font-weight: 600;
  cursor: pointer; text-align: center;
}
.btn-action.secondary { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
.btn-action.green  { background: #1a5a35; }
.btn-action.purple { background: #4a1a7a; }
.btn-action.small  { flex: 0; min-width: auto; padding: 9px 10px; }
.btn-action:active { opacity: 0.75; }

/* ROTEIRO PREVIEW */
.roteiro-box {
  background: var(--surface2); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 8px;
  font-size: 12px; line-height: 1.6; color: #ccc;
  max-height: 120px; overflow-y: auto;
  white-space: pre-wrap;
}
.roteiro-box.expanded { max-height: none; }
.btn-expand {
  background: none; border: none; color: var(--muted);
  font-size: 11px; cursor: pointer; padding: 2px 0 8px;
  display: block;
}

/* AUDIO PLAYER */
.audio-player {
  background: var(--surface2); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 8px;
}
.audio-player p { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.audio-player audio { width: 100%; }

/* PUBLISH BOX */
.publish-box {
  background: var(--surface2); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 8px; font-size: 12px;
}
.publish-box-title { font-weight: 600; color: var(--orange); margin-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
.pub-row { display: flex; gap: 8px; margin-bottom: 3px; color: var(--muted); align-items: flex-start; }
.pub-row strong { color: var(--text); min-width: 65px; flex-shrink: 0; }

/* NOTAS */
.notas-box {
  background: var(--surface2); border-radius: 8px;
  padding: 8px 10px; margin-bottom: 8px;
  font-size: 11px; color: var(--muted); line-height: 1.4;
}

/* FAB */
.fab {
  position: fixed; bottom: 24px; right: 16px;
  background: var(--accent); color: white;
  border: none; border-radius: 56px;
  padding: 13px 20px; font-size: 14px; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 20px rgba(230,57,70,0.4);
  display: flex; align-items: center; gap: 7px; z-index: 200;
}
.fab:active { transform: scale(0.96); }

/* MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.8); z-index: 300; align-items: flex-end;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 20px 18px 40px; width: 100%;
  max-height: 92vh; overflow-y: auto;
}
.modal-handle {
  width: 36px; height: 4px; background: var(--border);
  border-radius: 2px; margin: 0 auto 18px;
}
.modal h2 { font-size: 17px; margin-bottom: 18px; }
.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 11px; color: var(--muted);
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px;
}
.field input, .field textarea, .field select {
  width: 100%; background: var(--surface2);
  border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; padding: 9px 11px;
  font-size: 14px; font-family: inherit; outline: none;
}
.field textarea { min-height: 80px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 8px; margin-top: 20px; }
.modal-actions .btn-action { flex: 1; padding: 13px; font-size: 14px; }

/* TOPIC SEARCH */
.topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.topic-chip {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px;
  font-size: 12px; cursor: pointer; text-align: left;
  color: var(--text); line-height: 1.3;
}
.topic-chip:active { border-color: var(--accent); }
.topic-chip .chip-emoji { font-size: 18px; display: block; margin-bottom: 4px; }
.topic-chip .chip-label { font-weight: 600; }
.topic-chip .chip-sub { color: var(--muted); font-size: 11px; }

/* SETTINGS */
.settings-info {
  background: var(--surface2); border-radius: 8px;
  padding: 12px; margin-bottom: 14px;
  font-size: 12px; line-height: 1.5; color: var(--muted);
}
.settings-info strong { color: var(--text); }

/* TITULO OPTIONS */
.titulo-options { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.titulo-opt {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 7px; padding: 8px 10px;
  font-size: 12px; color: var(--text); cursor: pointer; text-align: left;
}
.titulo-opt.selected { border-color: var(--accent); color: var(--accent); }

/* SCHEDULE */
.sched-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sched-row .field { margin-bottom: 0; }

/* EMPTY */
.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty-icon { font-size: 36px; margin-bottom: 10px; }
.empty p { font-size: 13px; }

/* TOAST */
.toast {
  position: fixed; bottom: 85px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: #222; border: 1px solid var(--border);
  color: var(--text); border-radius: 24px;
  padding: 9px 18px; font-size: 12px; font-weight: 500;
  opacity: 0; transition: all 0.2s; z-index: 999; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>Mundo em <span>Fatos</span></h1>
  <button class="btn-icon" onclick="openSettings()">⚙</button>
</header>

<div class="tabs">
  <button class="tab active" onclick="setFilter('todos',this)">Todos</button>
  <button class="tab" onclick="setFilter('tema',this)">Tema</button>
  <button class="tab" onclick="setFilter('roteiro',this)">Roteiro</button>
  <button class="tab" onclick="setFilter('roteiro_aprovado',this)">Aprovado</button>
  <button class="tab" onclick="setFilter('audio_gerado',this)">Áudio</button>
  <button class="tab" onclick="setFilter('cenarios',this)">Cenas</button>
  <button class="tab" onclick="setFilter('montagem',this)">Montagem</button>
  <button class="tab" onclick="setFilter('agendado',this)">Agendado</button>
  <button class="tab" onclick="setFilter('publicado',this)">✓</button>
</div>

<main>
  <div class="stats" id="stats"></div>
  <div class="cards" id="cards"></div>
</main>

<button class="fab" onclick="openNovoShort()">＋ Short</button>

<!-- MODAL NOVO SHORT -->
<div class="modal-overlay" id="modalShort">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Novo Short</h2>

    <div class="field">
      <label>Tema do vídeo</label>
      <input type="text" id="ns_tema" placeholder="Ex: Por que sonhamos com quedas?" oninput="filterTopics(this.value)">
    </div>

    <div style="font-size:11px;color:var(--muted);margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">Ou escolha uma ideia</div>
    <div class="topic-grid" id="topicGrid"></div>

    <div class="field">
      <label>Formato</label>
      <select id="ns_tipo">
        <option value="short">Short (30–45s, PROF solo)</option>
        <option value="longo">Longo</option>
      </select>
    </div>

    <div class="field">
      <label>Notas adicionais (opcional)</label>
      <textarea id="ns_notas" placeholder="Alguma ideia específica, tom, referência..."></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-action secondary" onclick="closeModal('modalShort')">Cancelar</button>
      <button class="btn-action" onclick="criarShort()">Criar</button>
    </div>
  </div>
</div>

<!-- MODAL EDITAR -->
<div class="modal-overlay" id="modalEdit">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Editar</h2>
    <input type="hidden" id="edit_id">
    <div class="field"><label>Título</label><input type="text" id="edit_titulo"></div>
    <div class="field"><label>Tema</label><input type="text" id="edit_tema"></div>
    <div class="field"><label>Roteiro</label><textarea id="edit_roteiro" style="min-height:140px"></textarea></div>
    <div class="field"><label>Link do Áudio</label><input type="text" id="edit_audio" placeholder="URL do mp3"></div>
    <div class="field"><label>Notas</label><textarea id="edit_notas"></textarea></div>
    <div class="modal-actions">
      <button class="btn-action secondary" onclick="closeModal('modalEdit')">Cancelar</button>
      <button class="btn-action" onclick="salvarEdicao()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL AGENDAR -->
<div class="modal-overlay" id="modalAgendar">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Agendar Publicação</h2>
    <input type="hidden" id="ag_id">

    <div class="field">
      <label>Escolha o título</label>
      <div id="ag_titulos" class="titulo-options"></div>
      <input type="text" id="ag_titulo_custom" placeholder="Ou escreva um título" style="margin-top:8px">
    </div>
    <div class="field"><label>Descrição</label><textarea id="ag_desc" style="min-height:90px"></textarea></div>
    <div class="field"><label>Tags</label><input type="text" id="ag_tags" placeholder="tag1, tag2, tag3"></div>
    <div class="sched-row">
      <div class="field"><label>Data</label><input type="date" id="ag_data"></div>
      <div class="field"><label>Hora</label><input type="time" id="ag_hora" value="17:55"></div>
    </div>
    <div class="field"><label>Plataforma</label>
      <select id="ag_plataforma">
        <option value="youtube_tiktok">YouTube + TikTok</option>
        <option value="youtube">Só YouTube</option>
        <option value="tiktok">Só TikTok</option>
      </select>
    </div>
    <div class="field"><label>Link da Capa</label><input type="text" id="ag_capa" placeholder="URL ou nome do arquivo"></div>
    <div class="modal-actions">
      <button class="btn-action secondary" onclick="closeModal('modalAgendar')">Cancelar</button>
      <button class="btn-action purple" onclick="salvarAgendamento()">Agendar</button>
    </div>
  </div>
</div>

<!-- MODAL SETTINGS -->
<div class="modal-overlay" id="modalSettings">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Configurações</h2>
    <div class="settings-info">
      <strong>GitHub Token</strong> — permite salvar roteiros direto no repositório pelo celular. Fica salvo só no seu dispositivo.
    </div>
    <div class="field"><label>Personal Access Token</label><input type="password" id="s_token" placeholder="ghp_xxxx"></div>
    <div class="field"><label>Repositório</label><input type="text" id="s_repo" value="canalmundoemfatosofficial-pixel/App-web---Mundo-em-Fatos"></div>
    <div class="field"><label>Caminho do JSON</label><input type="text" id="s_path" value="public/painel/roteiros.json"></div>
    <div class="modal-actions">
      <button class="btn-action secondary" onclick="closeModal('modalSettings')">Fechar</button>
      <button class="btn-action" onclick="salvarSettings()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── PIPELINE ───────────────────────────────────────────────
const PIPELINE = [
  { id: 'tema',             label: 'Tema' },
  { id: 'roteiro',          label: 'Roteiro' },
  { id: 'roteiro_aprovado', label: 'Aprovado' },
  { id: 'audio_gerado',     label: 'Áudio' },
  { id: 'audio_aprovado',   label: 'Áudio ✓' },
  { id: 'cenarios',         label: 'Cenas' },
  { id: 'montagem',         label: 'Montagem' },
  { id: 'agendado',         label: 'Agendado' },
  { id: 'publicado',        label: 'Publicado' }
];

const STATUS_LABEL = {};
PIPELINE.forEach(p => STATUS_LABEL[p.id] = p.label);

// ─── TOPICS ─────────────────────────────────────────────────
const TOPICS = [
  { emoji:'🧠', label:'Cérebro', sub:'Como sonhos funcionam' },
  { emoji:'🌊', label:'Oceano', sub:'Mistérios do fundo do mar' },
  { emoji:'⚡', label:'Energia', sub:'Fatos sobre raios' },
  { emoji:'🦠', label:'Vírus', sub:'Como evoluem' },
  { emoji:'🌍', label:'História', sub:'Fatos que ninguém conta' },
  { emoji:'🚀', label:'Espaço', sub:'Descobertas recentes' },
  { emoji:'🤔', label:'Filosofia', sub:'Paradoxos do cotidiano' },
  { emoji:'💰', label:'Economia', sub:'Por que os preços sobem' },
  { emoji:'🧬', label:'DNA', sub:'Segredos do corpo humano' },
  { emoji:'🌋', label:'Geologia', sub:'Por que a terra treme' },
];

// ─── STATE ───────────────────────────────────────────────────
let roteiros = [];
let currentFilter = 'todos';

// ─── STORAGE ─────────────────────────────────────────────────
function loadLocal() {
  const s = localStorage.getItem('mef_roteiros');
  if (s) roteiros = JSON.parse(s);
}
function saveLocal() {
  localStorage.setItem('mef_roteiros', JSON.stringify(roteiros));
}
function getSettings() {
  return {
    token: localStorage.getItem('mef_token') || '',
    repo:  localStorage.getItem('mef_repo')  || 'canalmundoemfatosofficial-pixel/App-web---Mundo-em-Fatos',
    path:  localStorage.getItem('mef_path')  || 'public/painel/roteiros.json'
  };
}

// ─── GITHUB API ───────────────────────────────────────────────
async function ghLoad() {
  const { token, repo, path } = getSettings();
  if (!token) return false;
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
      headers: { Authorization: `token ${token}` }
    });
    if (!r.ok) return false;
    const d = await r.json();
    roteiros = JSON.parse(atob(d.content));
    saveLocal();
    return true;
  } catch { return false; }
}
async function ghSave() {
  const { token, repo, path } = getSettings();
  if (!token) { saveLocal(); showToast('Salvo localmente'); return; }
  try {
    const cur = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
      headers: { Authorization: `token ${token}` }
    });
    const existing = await cur.json();
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(roteiros, null, 2))));
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `painel: ${new Date().toISOString().slice(0,16)}`,
        content, sha: existing.sha
      })
    });
    if (res.ok) { saveLocal(); showToast('✓ Salvo no GitHub'); }
    else { saveLocal(); showToast('Erro GitHub — salvo local'); }
  } catch { saveLocal(); showToast('Sem rede — salvo local'); }
}

// ─── RENDER ──────────────────────────────────────────────────
function render() {
  const list = currentFilter === 'todos'
    ? roteiros
    : roteiros.filter(r => r.status === currentFilter);

  const total    = roteiros.length;
  const producao = roteiros.filter(r => r.status !== 'publicado').length;
  const pub      = roteiros.filter(r => r.status === 'publicado').length;

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-num">${producao}</div><div class="stat-label">Em Produção</div></div>
    <div class="stat"><div class="stat-num">${pub}</div><div class="stat-label">Publicados</div></div>`;

  if (!list.length) {
    document.getElementById('cards').innerHTML = `
      <div class="empty"><div class="empty-icon">🎬</div>
      <p>Nenhum vídeo aqui.<br>Toque em <strong>＋ Short</strong> para começar.</p></div>`;
    return;
  }

  document.getElementById('cards').innerHTML =
    list.slice().reverse().map(cardHTML).join('');
}

function pipelineHTML(status) {
  const idx = PIPELINE.findIndex(p => p.id === status);
  return `<div class="pipeline">` +
    PIPELINE.map((p, i) => {
      const cls = i < idx ? 'done' : i === idx ? 'current' : 'next';
      return `<span class="pip-step ${cls}">${p.label}</span>`;
    }).join('') +
  `</div>`;
}

function cardHTML(r) {
  const pub = r.publicacao || {};
  let body = '';

  // pipeline bar
  body += pipelineHTML(r.status);

  // notas
  if (r.notas) body += `<div class="notas-box">📝 ${r.notas}</div>`;

  // roteiro preview (se tem)
  if (r.roteiro && ['roteiro','roteiro_aprovado','audio_gerado','audio_aprovado','cenarios','montagem','agendado','publicado'].includes(r.status)) {
    const id = `rot-${r.id}`;
    body += `<div class="roteiro-box" id="${id}">${r.roteiro}</div>
      <button class="btn-expand" onclick="toggleExpand('${id}')">Ver mais ▾</button>`;
  }

  // audio player
  if (r.audio_url && ['audio_gerado','audio_aprovado','cenarios','montagem','agendado','publicado'].includes(r.status)) {
    body += `<div class="audio-player"><p>🎙 Áudio gerado — ouça e aprove:</p>
      <audio controls src="${r.audio_url}"></audio></div>`;
  }

  // publish info
  if (pub.titulo_escolhido || pub.data) {
    body += `<div class="publish-box">
      <div class="publish-box-title">📋 Publicação</div>
      ${pub.titulo_escolhido ? `<div class="pub-row"><strong>Título:</strong>${pub.titulo_escolhido}</div>` : ''}
      ${pub.data ? `<div class="pub-row"><strong>Data:</strong>${pub.data} às ${pub.hora||'17:55'}</div>` : ''}
      ${pub.plataforma ? `<div class="pub-row"><strong>Plataforma:</strong>${pub.plataforma.replace('_',' + ')}</div>` : ''}
    </div>`;
  }

  // ACTION BUTTONS by status
  body += actionsHTML(r);

  return `<div class="card" id="card-${r.id}">
    <div class="card-top">
      <div class="card-info">
        <div class="badges">
          <span class="badge badge-${r.tipo||'short'}">${r.tipo==='longo'?'longo':'short'}</span>
          <span class="badge badge-s ${r.status}">${STATUS_LABEL[r.status]||r.status}</span>
        </div>
        <div class="card-titulo">${r.titulo||r.tema}</div>
        ${r.tema&&r.titulo ? `<div class="card-desc">${r.tema}</div>` : ''}
      </div>
      <div class="card-date">${fmtDate(r.atualizado_em)}</div>
    </div>
    <div class="card-body">${body}</div>
  </div>`;
}

function actionsHTML(r) {
  let h = '';
  const id = r.id;

  if (r.status === 'tema') {
    h += claudeBtn(id, 'roteiro', '✍️ Pedir Roteiro ao Claude',
      buildPromptRoteiro(r));
  }

  if (r.status === 'roteiro') {
    h += `<div class="card-actions">
      <button class="btn-action green" onclick="advance('${id}','roteiro_aprovado')">✓ Aprovar Roteiro</button>
      <button class="btn-action secondary" onclick="openEdit('${id}')">Editar</button>
    </div>`;
  }

  if (r.status === 'roteiro_aprovado') {
    h += claudeBtn(id, 'audio_gerado', '🎙 Pedir Áudio ao Claude',
      buildPromptAudio(r));
  }

  if (r.status === 'audio_gerado') {
    h += `<div class="card-actions">
      <button class="btn-action green" onclick="advance('${id}','audio_aprovado')">✓ Áudio Aprovado</button>
      <button class="btn-action secondary" onclick="openEdit('${id}')">Link do Áudio</button>
    </div>`;
  }

  if (r.status === 'audio_aprovado') {
    h += claudeBtn(id, 'cenarios', '🎨 Pedir Cenários ao Claude',
      buildPromptCenarios(r));
  }

  if (r.status === 'cenarios') {
    h += claudeBtn(id, 'montagem', '🎬 Pedir Montagem ao Claude',
      buildPromptMontagem(r));
  }

  if (r.status === 'montagem') {
    h += `<div class="card-actions">
      <button class="btn-action purple" onclick="openAgendar('${id}')">📅 Agendar Publicação</button>
    </div>`;
  }

  if (r.status === 'agendado') {
    h += `<div class="card-actions">
      <button class="btn-action green" onclick="advance('${id}','publicado')">✓ Publicado</button>
    </div>`;
  }

  // edit + delete always
  h += `<div class="card-actions" style="margin-top:7px">
    <button class="btn-action secondary" onclick="openEdit('${id}')">Editar</button>
    <button class="btn-action secondary small" style="color:var(--accent)" onclick="deleteRoteiro('${id}')">🗑</button>
  </div>`;

  return h;
}

function claudeBtn(id, nextStatus, label, prompt) {
  const encoded = encodeURIComponent(prompt);
  const url = `https://claude.ai/new?q=${encoded}`;
  return `<a class="btn-claude" href="${url}" target="_blank" onclick="markWaiting('${id}','${nextStatus}')">
    <span class="claude-icon">✦</span>${label}
  </a>`;
}

// ─── PROMPTS ─────────────────────────────────────────────────
function buildPromptRoteiro(r) {
  return `Crie um roteiro para um Short do canal Mundo em Fatos sobre o tema: "${r.tema}".

Formato: PROF solo, 30-45 segundos, 9:16 vertical.
O PROF narra com voz dinâmica, didática e com humor leve.
Termine com: "Segue para ficar por dentro do Mundo."
${r.notas ? `\nObservação: ${r.notas}` : ''}

Depois de criar, salve o roteiro no painel (roteiros.json) com status "roteiro" para o vídeo "${r.titulo||r.tema}" (id: ${r.id}).`;
}

function buildPromptAudio(r) {
  return `Gere o áudio TTS para o seguinte roteiro do Short "${r.titulo||r.tema}" usando Gemini TTS (voz Fenrir, estilo PROF solo dinâmico):

${r.roteiro || '[roteiro pendente — verifique o app]'}

Após gerar, salve o link do arquivo de áudio no painel (roteiros.json) no campo audio_url do vídeo id: ${r.id} e atualize o status para "audio_gerado".`;
}

function buildPromptCenarios(r) {
  return `Com base no roteiro abaixo, crie a lista de cenários para o Short "${r.titulo||r.tema}".

Roteiro:
${r.roteiro || '[roteiro no app]'}

Formato 9:16. PROF solo. Cena a cada 5-8 segundos. Descreva cada cena (fundo, elemento visual, transição).
Salve os cenários no painel (roteiros.json) no campo "cenarios" do vídeo id: ${r.id} e atualize o status para "cenarios".`;
}

function buildPromptMontagem(r) {
  return `Monte o vídeo Short completo para "${r.titulo||r.tema}" (id: ${r.id}).

Áudio: ${r.audio_url || '[ver app]'}
Cenários: ${r.cenarios || '[ver app]'}

Formato 9:16, 30-45s. Corte a cada 5-8s. Após montar, entregue também:
- 3 sugestões de título
- Descrição para YouTube/TikTok
- Tags
- Instrução para capa

Salve tudo no painel (roteiros.json) no campo "publicacao" do vídeo id: ${r.id} e atualize o status para "montagem".`;
}

// ─── ACTIONS ─────────────────────────────────────────────────
function advance(id, newStatus) {
  const r = roteiros.find(x => x.id === id);
  if (!r) return;
  r.status = newStatus;
  r.atualizado_em = today();
  ghSave(); render();
}

function markWaiting(id, nextStatus) {
  // After clicking Claude button, we don't auto-advance — Claude will update via GitHub
  showToast('Claude vai atualizar o app automaticamente');
}

function toggleExpand(id) {
  const el = document.getElementById(id);
  el.classList.toggle('expanded');
}

// ─── CRUD ────────────────────────────────────────────────────
function openNovoShort() {
  document.getElementById('ns_tema').value = '';
  document.getElementById('ns_notas').value = '';
  document.getElementById('ns_tipo').value = 'short';
  renderTopics('');
  openModal('modalShort');
}

function renderTopics(filter) {
  const q = filter.toLowerCase();
  const filtered = q
    ? TOPICS.filter(t => t.label.toLowerCase().includes(q) || t.sub.toLowerCase().includes(q))
    : TOPICS;
  document.getElementById('topicGrid').innerHTML = filtered.map(t =>
    `<button class="topic-chip" onclick="selectTopic('${t.label} — ${t.sub}')">
      <span class="chip-emoji">${t.emoji}</span>
      <span class="chip-label">${t.label}</span>
      <span class="chip-sub">${t.sub}</span>
    </button>`
  ).join('');
}

function filterTopics(val) { renderTopics(val); }

function selectTopic(label) {
  document.getElementById('ns_tema').value = label;
}

function criarShort() {
  const tema = document.getElementById('ns_tema').value.trim();
  if (!tema) { showToast('Digite um tema'); return; }
  const novo = {
    id: 'rot-' + Date.now(),
    titulo: tema,
    tema,
    tipo: document.getElementById('ns_tipo').value,
    status: 'tema',
    roteiro: '',
    audio_url: '',
    cenarios: '',
    notas: document.getElementById('ns_notas').value.trim(),
    publicacao: {},
    criado_em: today(),
    atualizado_em: today()
  };
  roteiros.push(novo);
  closeModal('modalShort');
  ghSave(); render();
}

function openEdit(id) {
  const r = roteiros.find(x => x.id === id);
  if (!r) return;
  document.getElementById('edit_id').value    = id;
  document.getElementById('edit_titulo').value = r.titulo || '';
  document.getElementById('edit_tema').value   = r.tema || '';
  document.getElementById('edit_roteiro').value = r.roteiro || '';
  document.getElementById('edit_audio').value  = r.audio_url || '';
  document.getElementById('edit_notas').value  = r.notas || '';
  openModal('modalEdit');
}

function salvarEdicao() {
  const id = document.getElementById('edit_id').value;
  const r  = roteiros.find(x => x.id === id);
  if (!r) return;
  r.titulo    = document.getElementById('edit_titulo').value.trim();
  r.tema      = document.getElementById('edit_tema').value.trim();
  r.roteiro   = document.getElementById('edit_roteiro').value.trim();
  r.audio_url = document.getElementById('edit_audio').value.trim();
  r.notas     = document.getElementById('edit_notas').value.trim();
  r.atualizado_em = today();
  closeModal('modalEdit');
  ghSave(); render();
}

function deleteRoteiro(id) {
  const r = roteiros.find(x => x.id === id);
  if (!r) return;
  if (!confirm(`Excluir "${r.titulo||r.tema}"?`)) return;
  roteiros = roteiros.filter(x => x.id !== id);
  ghSave(); render();
}

// ─── AGENDAR ─────────────────────────────────────────────────
function openAgendar(id) {
  const r   = roteiros.find(x => x.id === id);
  if (!r) return;
  const pub = r.publicacao || {};
  document.getElementById('ag_id').value = id;

  const sugs = r.sugestoes_titulo || [`${r.titulo} | Mundo em Fatos`, `Você não vai acreditar sobre ${r.tema}`, `A verdade sobre ${r.tema}`];
  document.getElementById('ag_titulos').innerHTML = sugs.map(t =>
    `<button class="titulo-opt ${pub.titulo_escolhido===t?'selected':''}" onclick="selectTit(this,'${t.replace(/'/g,"\\'")}'">${t}</button>`
  ).join('');

  document.getElementById('ag_titulo_custom').value = pub.titulo_custom || '';
  document.getElementById('ag_desc').value      = pub.descricao || '';
  document.getElementById('ag_tags').value      = pub.tags || '';
  document.getElementById('ag_data').value      = pub.data || '';
  document.getElementById('ag_hora').value      = pub.hora || '17:55';
  document.getElementById('ag_plataforma').value = pub.plataforma || 'youtube_tiktok';
  document.getElementById('ag_capa').value      = pub.capa || '';
  openModal('modalAgendar');
}

function selectTit(el, t) {
  document.querySelectorAll('.titulo-opt').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('ag_titulo_custom').value = '';
}

function salvarAgendamento() {
  const id = document.getElementById('ag_id').value;
  const r  = roteiros.find(x => x.id === id);
  if (!r) return;
  const sel = document.querySelector('.titulo-opt.selected');
  r.publicacao = {
    titulo_escolhido: document.getElementById('ag_titulo_custom').value.trim() || (sel ? sel.textContent : ''),
    descricao:  document.getElementById('ag_desc').value,
    tags:       document.getElementById('ag_tags').value,
    data:       document.getElementById('ag_data').value,
    hora:       document.getElementById('ag_hora').value,
    plataforma: document.getElementById('ag_plataforma').value,
    capa:       document.getElementById('ag_capa').value
  };
  r.status = 'agendado';
  r.atualizado_em = today();
  closeModal('modalAgendar');
  ghSave(); render();
}

// ─── SETTINGS ────────────────────────────────────────────────
function openSettings() {
  const s = getSettings();
  document.getElementById('s_token').value = s.token;
  document.getElementById('s_repo').value  = s.repo;
  document.getElementById('s_path').value  = s.path;
  openModal('modalSettings');
}
function salvarSettings() {
  localStorage.setItem('mef_token', document.getElementById('s_token').value.trim());
  localStorage.setItem('mef_repo',  document.getElementById('s_repo').value.trim());
  localStorage.setItem('mef_path',  document.getElementById('s_path').value.trim());
  closeModal('modalSettings');
  showToast('✓ Configurado');
  ghLoad().then(ok => { if (ok) { render(); showToast('✓ Dados do GitHub carregados'); } });
}

// ─── FILTER ──────────────────────────────────────────────────
function setFilter(status, el) {
  currentFilter = status;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

// ─── UTILS ───────────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function today()        { return new Date().toISOString().split('T')[0]; }
function fmtDate(d)     { if (!d) return ''; const [,m,day] = d.split('-'); return `${day}/${m}`; }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

document.querySelectorAll('.modal-overlay').forEach(o =>
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); })
);

// ─── INIT ─────────────────────────────────────────────────────
async function init() {
  loadLocal();
  if (!roteiros.length) {
    try {
      const r = await fetch('roteiros.json');
      if (r.ok) roteiros = await r.json();
    } catch {}
    saveLocal();
  }
  renderTopics('');
  render();
  const { token } = getSettings();
  if (token) ghLoad().then(ok => { if (ok) render(); });
}

init();
</script>
</body>
</html>
